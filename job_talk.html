# The Role of Personality and Emotion

--

Differences in **trait anxiety** &rarr; differences in sensitivity to stressors.<sup>1</sup>

.footnote[<code><sup>1</sup> Gray & McNaughton 2000; Hajcak, Klawohn, & Meyer 2019</code>
      ]

--

- Highly stable across the lifespan<sup>2</sup>

.footnote[<code><sup>2</sup> Hovenkamp-Hermelink et al. 2019; Nivard et al. 2015</code>]

--
background-image: url("imgs/cnn.png")
background-position: 11% 82%
background-size: 42.5%

- Stressor &times; **high** trait anxiety &rarr; **increase** in felt vulnerability &rarr; **more** updating

--
background-image: url("imgs/cnn.png"), url("imgs/npr.png")
background-position: 11% 82%, 86% 77%
background-size: 42.5%, 42.5%

- Stressor &times; **low** trait anxiety &rarr; **no change** in felt vulnerability &rarr; **less** updating

## **Study 2** | Does Trait Anxiety Index Sensitivity to Anxiety States?

--

.bold[Sample]: **Bovitz** (N = 1,009 | US quota sample | February 21-28, 2025)

--
      
.bold[Treatment]: **Autobiographical Emotional Memory Task**<sup>1</sup>
- "Please describe in detail the one situation that has made you the most anxious..."
      
.footnote[<code><sup>1</sup> Albertson & Gadarian 2017; Searles & Mattes 2015; Young 2019</code>]
--

.bold[Moderator]: **Trait Anxiety** 
- "How well do the following statements describe you?" <code>Worry about things, Fear for the worst, Am afraid of many things, Get stressed out easily.</code>

--

.bold[DV]: **Subjective Vulnerability**
- "When it comes to your overall wellbeing, how secure or vulnerable do you feel?" <code>1. Very secure, 2. Secure, 3. Somewhat secure, 4. Somewhat vulnerable, 5. Vulnerable, 6. Very vulnerable</code>

name: matching-methods
## **Estimation** | Matching + Weighting

--

- Problem: Job loss isn't completely random

--

- Strategy: For each person laid off during panel, match with valid comparison group<sup>1</sup>

.footnote[<code><sup>1</sup> Imai, Kim, & Wang 2023</code>
      <font style="color:white;font-size:10px;">_</font>]

--

- **$Y_1$:** Any person employed &rarr; laid off during panel.

--

- **$Y_0$:** Weighted average of all people who ...
 - have the same work history as $Y_1$ prior to when $Y_1$ is laid off 
 - .bold[remain] employed when $Y_1$ is laid off ([see matching example](#matching-demo))

--

- $Y_0$ weighted to resemble $Y_1$ using covariate balancing propensity scores (CBPS).<sup>2</sup>

.footnote[<code><sup>2</sup> Imai & Ratkovic 2014</code>]
