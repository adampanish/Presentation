# How Anxiety Shapes Moral Politics
<br>
### Adam R. Panish, Andrew W. Delton, Theresa E. Robertson
## Stony Brook University
### Aaron W. Lukaszewski
## California State University, Fullerton
<br><br>
### 83rd MPSA. Chicago IL. April 25 2026

---
# The Moral Politics of Care

--

Politicians and laypeople justify politics by appealing to **morality**

--

One moral imperative is invoked more than others: the value of **care**

- One ought to nurture vulnerable people, protect them from harm

--

Americans find people who disagree about care **contemptible and untrustworthy**<sup>1</sup> &mdash; more so than out-partisans

.footnote[<code><sup>1</sup> Jung and Clifford 2025</code><br>
      <span style='color:white;'>.</span>
      ]

--

**40% of Americans** invoke care when evaluating parties and candidates<sup>2</sup> &mdash; higher than any other moral value

.footnote[<code><sup>2</sup> Kraft 2018</code>
      ]

--

Policy stakes: What do we owe children, single mothers, people who are homeless, elderly, poor, etc?
- Prioritize care &rarr; protect and nurture at any cost
- Unmoved by care &rarr; not worth high costs<sup>3</sup>

.footnote[<code><sup>3</sup> Feldman and Steenbergen 2001</code>]

---
# Why Is Care So Divisive?

--

Moral Foundations Theory (MFT):<sup>1</sup> five innate moral concerns &mdash; **care, fairness, authority, loyalty, purity**

.footnote[<code><sup>1</sup> Graham et al. 2013; Haidt 2012</code><br>
      <span style='color:white;'>.</span>
      ]

--

Care evokes strong feelings because humans are uniquely **vulnerable**:<sup>2</sup> long childhoods, fragile bodies, labor intensive food

.footnote[<code><sup>2</sup> Leach 2003; Sugiyama 2004a, 2004b</code>
      ]

--

Humans have become adept at using **moral appeals** to convince others to offer help<sup>3</sup>

.footnote[<code><sup>3</sup> Petersen et al. 2013, 2014; Petersen and Laustsen 2019</code>]

--

&rArr; People who **feel vulnerable** should moralize care; people who **feel secure** should downplay it

---
# From Vulnerability to Anxiety

--

Trait **anxiety**: major component of neuroticism<sup>1</sup> &mdash; the other is **emotional volatility**

.footnote[<code><sup>1</sup> McCrae and Costa 2003</code>
      ]

--

Anxiety tracks sensitivity of a neural system for **avoiding harm**<sup>2</sup> &rarr; felt vulnerability

.footnote[<code><sup>2</sup> Corr, DeYoung, and McNaughton 2013</code>]

--

Volatility is linked to **anger**, not vulnerability

--

.bold[Hypotheses]

.bold[H1]: Anxious people score higher on **care**, but not other moral foundations

.bold[H2]: **Volatile** people do not score higher on care, despite frequent negative emotions

.bold[H3]: **Physically vulnerable** people score higher on care, but not other moral foundations

---
# Data and Methods

---
## **Data** | Four US Samples + One Student Sample

--

Total N = 4,914 (nationally representative) + 369 (student)

--

.bold[ANES] | American National Election Studies (N = 448)
- 2007 national probability sample | MFQ-20 in 2008, TIPI in 2010

--

.bold[TAPS] | The American Panel Survey (N = 1,396)
- 2011 national probability sample | MFQ-20 and TIPI in 2012

--

.bold[CCES] | Cooperative Congressional Election Studies (N = 1,000)
- 2016 YouGov quota sample | MFQ-30 and TIPI

--

.bold[NSYR] | National Study of Youth and Religion (N = 2,070)
- 2002 probability sample of 13-17 year olds | MFQ-20 and anxiety in 2013

--

.bold[Student Sample] | Oklahoma State University (N = 369)
- 2017 convenience sample of undergraduates | MFQ-20, Mini-IPIP, and strength

---
## **Measures** | Key Variables

--

.bold[Anxiety] (ANES, TAPS, CCES): Ten-Item Personality Inventory (TIPI)
- "I see myself as: **anxious, easily upset**" (1. disagree strongly ... 7. agree strongly)

--

.bold[Anxiety] (NSYR): Average of five items on feelings of anxiety, worry, nervousness, fear

--

.bold[Moral Foundations]: Moral Foundations Questionnaire (MFQ-20 or MFQ-30)
- Example **care** item: Is it relevant to morality "whether or not someone cared for someone weak or vulnerable"?

--

.bold[Physical Strength] (Student): Composite of **chest + handgrip** strength (kg/F)
- Jamar dynamometer; r = 0.82 between measures

--

.bold[Rescaling]: IVs rescaled so 5th pct = 0 and 95th pct = 1; DVs z-scored

## **H3** | Do Objectively Vulnerable People Moralize Care?

--

The results so far rely on **self-reports**

--

Could be driven by variation in self-perceptions or biased survey-taking behavior

--

Turn to two objectively assessed variables psychologists identify as sources of felt vulnerability:<sup>1</sup>

.footnote[<code><sup>1</sup> Manson et al. 2023</code>]

--

- **Biological sex**

--

- **Physical strength**

# Conclusion

--

- Anxious people place **greater moral importance** on caring for the vulnerable

--

- Relationship is **not** explained by demographics, SES, other personality traits, or partisanship

--

- **Objective indicators of vulnerability** &mdash; sex and strength &mdash; show similar patterns

--

- Subtle motives can shape the morals that **fuel political disagreement**

--

- Why does care divide us so strongly? Part of the answer is that some of us feel more vulnerable than others
