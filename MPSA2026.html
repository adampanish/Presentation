# How Anxiety Shapes Moral Politics
### Adam R. Panish, Andrew W. Delton, Theresa E. Robertson
## Stony Brook University
### Aaron W. Lukaszewski
## California State University, Fullerton
<br><br><br>
### April 25, 2026
### MPSA

---
# Morality and Politics

--

Politicians and laypeople often justify their politics by appealing to **morality**

--

- "Should" and "ought"

--

- People who defy these injunctions are *fundamentally bad*

--

In theory, any issue can become moralized

--

In practice, one moral imperative is invoked more than others:

--

- The value of **care** &rarr; one ought to nurture the vulnerable and protect them from harm

---
# Why Care is Special

--

Americans find people who disagree about care **contemptible and untrustworthy**<sup>1</sup>

- Dislike them even more than out-partisans

.footnote[<code><sup>1</sup> Jung and Clifford 2025</code><br>
      <span style='color:white;'>_</span>
      ]

--

**40% of Americans** invoke care when evaluating parties and candidates<sup>2</sup>

- Higher rate than any other moral value

.footnote[<code><sup>2</sup> Kraft 2018</code>
      ]

--

These disagreements matter for policy:

--

- Should government help children, single mothers, the homeless, elderly, or poor?

--

- For those who prioritize care &rarr; the cost seems trivial

--

- For people less moved &rarr; a waste or even a reward for dependency<sup>3</sup>

.footnote[<code><sup>3</sup> Feldman and Steenbergen 2001</code>]

---
# What Explains Disagreements About Care?

--

Drawing on work connecting **personality traits to politics**<sup>1</sup>...

.footnote[<code><sup>1</sup> Bakker 2023</code>
      ]

--

We theorize that people moralize care partly as a response to worries about their own vulnerability

--

Focus on personality trait **anxiety** &rarr; a facet of neuroticism

--

- Anxious people support policies that buffer against vulnerability (e.g., redistribution)<sup>2</sup>

.footnote[<code><sup>1</sup> Bakker 2023</code><br>
      <code><sup>2</sup> Panish and Delton 2025</code>]

--

But a more fundamental question: Do anxious people place extra moral significance on **care** &mdash; a general principle that can ground support for specific policies?

---
# Moral Foundations Theory

--

**Moral Foundations Theory (MFT)**<sup>1</sup>: Human morality can be divided into a small number of domains called foundations

.footnote[<code><sup>1</sup> Graham et al. 2013; Haidt 2012; Haidt and Joseph 2007</code>
      ]

--

Each foundation is an innate category that evolved to solve an ancestral problem:

--

- **Care** &mdash; giving and receiving care

--

- **Fairness** &mdash; cooperation and reciprocity

--

- **Authority** &mdash; managing hierarchies

--

- **Loyalty** &mdash; ingroup cohesion

--

- **Purity** &mdash; avoiding contamination

--

Rhetoric tailored to these foundations is particularly persuasive<sup>2</sup>

.footnote[<code><sup>1</sup> Graham et al. 2013; Haidt 2012; Haidt and Joseph 2007</code><br>
      <code><sup>2</sup> Clifford et al. 2015; Clifford and Jerit 2013; Jung 2020; Lipsitz 2018</code>]

---
# Why Should Care Be Especially Divisive?

--

Our species is uniquely **vulnerable**

--

- Over a decade as children<sup>1</sup>

.footnote[<code><sup>1</sup> Leach 2003</code>
      ]

--

- Even as adults, our bodies are fragile compared to other primates

--

- We depend on food that is difficult to acquire

--

- If illness or injury prevented our ancestors from foraging &rarr; starvation unless someone cared for them<sup>2</sup>

.footnote[<code><sup>1</sup> Leach 2003</code><br>
      <code><sup>2</sup> Sugiyama 2004a, 2004b</code>]

--

In response, humans have become **adept at convincing one another to offer help**<sup>3</sup>

.footnote[<code><sup>1</sup> Leach 2003</code><br>
      <code><sup>2</sup> Sugiyama 2004a, 2004b</code><br>
      <code><sup>3</sup> Aarøe and Petersen 2013; Petersen et al. 2013, 2014; Petersen and Laustsen 2019</code>]

--

People use **moral appeals** to persuade others to favor their interests

--

- People who feel vulnerable &rarr; should **moralize care**
- People who feel secure &rarr; should **downplay its importance**

---
# Connecting Anxiety to Care

--

Trait **anxiety** &rarr; one of two major components of **neuroticism**<sup>1</sup>

.footnote[<code><sup>1</sup> McCrae and Costa 2003</code>
      ]

--

- The other is **emotional volatility**

--

Anxiety and volatility are correlated, but **meaningfully different**

--

- Anxiety tracks sensitivity of a neural system dedicated to **avoiding harm**<sup>2</sup>

.footnote[<code><sup>1</sup> McCrae and Costa 2003</code><br>
      <code><sup>2</sup> Corr, DeYoung, and McNaughton 2013</code>]

--

- When triggered &rarr; makes people feel **vulnerable** &rarr; motivates them to seek **care**

--

- Volatility, in contrast, is linked to **anger**, not vulnerability

---
# Hypotheses

--

.bold[H1]: Anxious people will score higher on **care**, but not the other moral foundations

--

.bold[H2]: **Volatile** people will not score higher on care

--

.bold[H3]: **Physically vulnerable** people (women, the weak) will moralize care more

---
# Data and Methods

---
## **Data** | Four US Samples + One Student Sample

--

Total N = 4,914 (nationally representative) + 369 (student)

--

.bold[ANES] | US adults (N = 448)
- Recruited November 2007, MFQ-20 in July 2008, TIPI in 2010

--

.bold[TAPS] | The American Panel Survey (N = 1,396)
- Random sample of US adults, MFQ-20 in 2012, TIPI in 2012

--

.bold[CCES] | Cooperative Congressional Election Studies (N = 1,000)
- YouGov panelists in 2016, MFQ-30 and TIPI

--

.bold[NSYR] | National Study of Youth and Religion (N = 2,070)
- Re-interviews in adulthood, MFQ-20 and multi-item anxiety measure

--

.bold[Student Sample] | Southern university (N = 369)
- **Grip + chest strength** measured objectively; MFQ-20 and Mini-IPIP

---
## **Measures** | Key Variables

--

.bold[Anxiety] (ANES, TAPS, CCES): Ten-Item Personality Inventory (TIPI)
- "I see myself as: **anxious, easily upset**" (1. disagree strongly ... 7. agree strongly)

--

.bold[Anxiety] (NSYR): Average of five items on feelings of anxiety, worry, nervousness, fear

--

.bold[Moral Foundations]: Moral Foundations Questionnaire (MFQ-20 or MFQ-30)
- Example **care** item: Is it relevant to morality "whether or not someone cared for someone weak or vulnerable"?

--

.bold[Physical Strength] (Student): Composite of **chest + handgrip** strength (kg/F)
- Jamar dynamometer; r = 0.82 between measures

--

.bold[Rescaling]: IVs rescaled so 5th pct = 0 and 95th pct = 1; DVs standardized

---
# Results

---
name: figure-1
## **H1** | Do Anxious People Moralize Care?

--
background-image: url("imgs_mpsa2026/Figure 1.png")
background-position: 50% 60%
background-size: 65%

---
## **H1** | Do Anxious People Moralize Care?

Of **twelve tests** (three model specifications &times; four samples):

--

- **Ten** showed a significant link between anxiety and care

--

- Random effects meta-analysis: **all three** meta-analytic estimates significant

--

- Moving from 5th pct &rarr; 95th pct of anxiety associated with a **0.28-SD increase** in care endorsement

--

- No other foundation has a consistent relationship with anxiety
 - Anxiety &harr; fairness significant in some tests
 - Makes sense: care and fairness are moderately correlated<sup>1</sup>

.footnote[<code><sup>1</sup> Kivikangas et al. 2021</code>
      ]

--

.bold[Takeaway]: Anxious Americans place more importance on **care** than their less anxious peers, but do not generally differ on other moral values

---
name: figure-2
## **H2** | Is It Anxiety, or Neuroticism Generally?

--
background-image: url("imgs_mpsa2026/Figure 2.png")
background-position: 50% 60%
background-size: 65%

---
## **H2** | Is It Anxiety, or Neuroticism Generally?

**Volatile people were never more likely to endorse care**

--

Even controlling for volatility:

--

- Anxious people endorsed care in **eight of nine tests**

--

- **All three** meta-analyses: anxiety predicts care, volatility does **not**

--

.bold[Takeaway]: Consistent with the hypothesis that personality traits related to **subjective vulnerability** &mdash; not neuroticism generally &mdash; are linked to care

---
## **H3** | Do Physically Vulnerable People Moralize Care?

--

The results so far rely on **self-reports**

--

Could be driven by variation in self-perceptions or survey-taking behavior

--

Turn to two objectively assessed variables psychologists identify as sources of felt vulnerability:<sup>1</sup>

.footnote[<code><sup>1</sup> Manson et al. 2023</code>
      ]

--

- **Biological sex**

--

- **Physical strength**

---
name: figure-3
## **H3** | Vulnerability Predicts Care

--
background-image: url("imgs_mpsa2026/Figure 3.png")
background-position: 50% 60%
background-size: 75%

---
## **H3** | Key Findings

.bold[Figure 3A] | Women endorsed all foundations more than men &mdash; but **especially** care

--

.bold[Figure 3B] | In the student sample (N = 369):
- Moving from 5th &rarr; 95th pct of strength &rarr; **0.79-SD drop** in care endorsement (p = 0.004)
- Holds with controls for demographics, SES, and personality
- Strength did **not** consistently predict other foundations

--

.bold[Figure 3C] | The strength&ndash;care relationship holds **within sexes**:
- Stronger males moralize care less than weaker males
- Stronger females moralize care less than weaker females

--

.bold[Takeaway]: Support for the hypothesis that **physically vulnerable** people place greater importance on care

---
# Robustness

--

Findings hold up controlling for:

--

- Demographics (age, race, education)

--

- Socioeconomic status (income)

--

- Other personality traits (volatility, openness, conscientiousness, extraversion, agreeableness)

--

- Partisanship and political ideology

--

[Alternative specifications &rarr;](#alt-specs)

---
# Conclusion

--

- Anxious people place **greater moral importance** on caring for the vulnerable

--

- Relationship is **not** explained by demographics, SES, other personality traits, or partisanship

--

- **Objective indicators of vulnerability** &mdash; sex and strength &mdash; show similar patterns

--

- Subtle motives can shape the morals that **fuel political disagreement**

--

- Why does care divide us so strongly? Part of the answer is that some of us feel more vulnerable than others
